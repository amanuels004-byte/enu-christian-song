
name: enu
description: A Christian music app for online streaming and offline listening.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.4
 just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.5
  dio: ^5.8.0+1
  file_picker: ^10.1.9
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
